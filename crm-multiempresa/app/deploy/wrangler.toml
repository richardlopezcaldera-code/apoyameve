# Sitio estático en Cloudflare (Workers con Static Assets).
# Root directory en Cloudflare: crm-multiempresa/app/deploy
# Los archivos servidos viven en ./public (la carpeta de assets NO debe
# contener este wrangler.toml).
name = "crm-multiempresa"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
